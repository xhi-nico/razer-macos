name: agent-instructions

# AGENTS.md is the source of truth; CLAUDE.md is a symlink to it. Project skills
# live in .agents/skills with .claude/skills symlinks.
#
# Generated by scripts/agents-md.sh in the workspace repo (xhi-nico/workspace-root).
# Edit the template there, then run `scripts/agents-md.sh fix --refresh-ci <repo>`
# rather than editing this file.
#
# This reads the git index, so it sees what was actually committed — catching
# anything pushed with --no-verify or from a machine without the local hook.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: CLAUDE.md must be a symlink to AGENTS.md; skills live in .agents/skills
        run: |
          fail=0
          tracked="$(git ls-files)"
          # Skills: every tracked .agents/skills/<name> needs a tracked
          # .claude/skills/<name> symlink pointing at it, and nothing real
          # may live under .claude/skills.
          for skill in $(printf '%s\n' "$tracked" | grep -E '^\.agents/skills/[^/]+/SKILL\.md$' | cut -d/ -f3 | sort -u); do
            link=".claude/skills/$skill"
            entry="$(git ls-files -s -- "$link" | head -1)"
            if [ -z "$entry" ]; then
              echo "::error file=.agents/skills/$skill/SKILL.md::no .claude/skills/$skill symlink tracked beside it"; fail=1; continue
            fi
            mode="${entry%% *}"; sha="$(printf '%s' "$entry" | awk '{print $2}')"
            if [ "$mode" != "120000" ] || [ "$(git cat-file blob "$sha")" != "../../.agents/skills/$skill" ]; then
              echo "::error file=$link::must be a symlink to ../../.agents/skills/$skill"; fail=1
            fi
          done
          if printf '%s\n' "$tracked" | grep -qE '^\.claude/skills/[^/]+/SKILL\.md$'; then
            echo "::error::real skill directories under .claude/skills; move them to .agents/skills and symlink"; fail=1
          fi
          while read -r mode sha stage path; do
            # Skill folders may ship an AGENTS.md as content; global/ is the
            # workspace's personal layer, read through home-folder symlinks.
            case "$path" in global/*|*/skills/*) continue ;; esac
            case "${path##*/}" in
              CLAUDE.md)
                target="$(git cat-file blob "$sha" 2>/dev/null || true)"
                if [ "$mode" != "120000" ]; then
                  echo "::error file=$path::committed as a real file — it must be a symlink to AGENTS.md"
                  fail=1
                elif [ "$target" != "AGENTS.md" ]; then
                  echo "::error file=$path::symlink points at '$target', expected AGENTS.md"
                  fail=1
                fi
                ;;
              AGENTS.md)
                if ! printf '%s\n' "$tracked" | grep -qxF "${path%AGENTS.md}CLAUDE.md"; then
                  echo "::error file=$path::no CLAUDE.md symlink tracked beside it"
                  fail=1
                fi
                ;;
            esac
          done < <(git ls-files -s)
          if [ "$fail" -eq 0 ]; then echo "AGENTS.md standard: clean"; fi
          exit $fail
