# Weekly library updates. Every minor and patch bump lands as one grouped PR, which
# dependabot-merge.yml merges once ci.yml passes. Major versions are not offered here; a
# major that fixes a security hole still arrives as a security PR and waits for George.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      libraries:
        update-types: [minor, patch]
